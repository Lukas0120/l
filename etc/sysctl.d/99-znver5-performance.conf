# --- Nätverk och TCP-optimering (BBR & FQ) ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fastopen = 3
net.core.somaxconn = 65535

# --- Virtuellt minne och Cache ---
# Minimerar swap och behåller applikationer i RAM
vm.swappiness = 10
# Tätare och snabbare skrivning till disk för att undvika I/O-flaskhalsar
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
# Balanserad cachelagring av inoder och katalogstrukturer
vm.vfs_cache_pressure = 50

# --- Filsystem och gränser ---
# Ökar kapaciteten för samtidiga processer och filövervakning
fs.file-max = 2097152
fs.aio-max-nr = 1048576
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 1024
