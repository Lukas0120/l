SET CFLAGS -O3 -ffast-math -march=znver5 -mtune=znver5 -pipe -flto -fuse-ld=lld -fomit-frame-pointer -fno-semantic-interposition -fno-plt -funroll-loops -fvectorize -fslp-vectorize -mllvm -polly -mllvm -polly-vectorizer=stripmine -mllvm -polly-run-inliner -mllvm -polly-run-dce -mllvm -polly-invariant-load-hoisting -mprefer-vector-width=512

SET CXXFLAGS -march=znver5 -mtune=znver5 -O3 -mprefer-vector-width=512 -ffast-math -fno-semantic-interposition -fno-threadsafe-statics -fdata-sections -ffunction-sections -pipe -fstack-protector-strong --param=ssp-buffer-size=4 -fno-plt -fopenmp -pthread -fomit-frame-pointer -fPIC -flto -falign-functions=32 -mllvm -polly -mllvm -polly-parallel -mllvm -polly-vectorizer=stripmine -mllvm -polly-run-dce -mllvm -polly-run-inliner -fvisibility-inlines-hidden

SET LDFLAGS -fuse-ld=lld -Wl,-O4,--sort-common,--as-needed,--gc-sections,-z,relro,-z,now,-lpthread -flto -falign-functions=32
